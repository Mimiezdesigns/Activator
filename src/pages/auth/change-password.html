<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Change | Activator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../styles/css/main.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="password-card shadow-sm p-4 bg-white rounded-4 text-start">
    <div class="brand-logo mb-4 text-center">
      <img src="../../public/assets/logo/logo.png" alt="Activator Logo">
    </div>

    <div class="text-center">
      <h4 class="fw-bold mb-2">Password Change Required</h4>
      <p class="text-muted">
        Welcome, for security reasons, you must change your temporary password before accessing the system.
      </p>
    </div>

    <form id="passwordForm">
      <div class="mb-3">
        <label class="form-label fw-medium">New Password</label>
        <div class="position-relative">
          <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" />
          <span class="toggle-password position-absolute end-0 top-50 translate-middle-y me-3 text-muted">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Re-enter Password</label>
        <div class="position-relative">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your new password" />
          <span class="toggle-password position-absolute end-0 top-50 translate-middle-y me-3 text-muted">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>

      <div class="password-requirements p-3 rounded-3 mt-4 mb-4">
        <p class="fw-semibold mb-2">Password Requirements</p>
        <ul class="list-unstyled mb-0">
          <li><span class="req-icon"></span> At least 8 characters</li>
          <li><span class="req-icon"></span> Contains lowercase letter</li>
          <li><span class="req-icon"></span> Contains uppercase letter</li>
          <li><span class="req-icon"></span> Contains number</li>
          <li><span class="req-icon"></span> Contains special character</li>
        </ul>
      </div>

      <button type="submit" class="btn btn-primary w-100" disabled>Set Password & Continue</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../scripts/auth/verify.js"></script>
</body>

</html>
