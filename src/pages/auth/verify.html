<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Verification Code - Activator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/css/main.css">
</head>

<body>

  <div class="login-container">
    <div class="login-card text-center ">
      <div class="brand-logo mb-3">
        <img src="../../public//assets/logo/logo.svg" class="logo" alt="Activator Logo">
      </div>


      <h4 class="fw-bold mb-2">Enter Verification Code</h4>
      <p class="text-muted">
        We've sent a 6-digit code to your registered device.
        Enter it below to complete sign-in.

      </p>

        
      <div class="text-start">
        <label class="form-label fw-semibold">Secure code</label>
      </div>

      <form id="otpForm">
        <div class="otp-inputs mb-4">
          <input type="text" maxlength="1" class="form-control otp-box" required>
          <input type="text" maxlength="1" class=" form-control otp-box" required>
          <input type="text" maxlength="1" class=" form-control otp-box" required>
          <span class="dash">-</span>
          <input type="text" maxlength="1" class=" form-control otp-box" required>
          <input type="text" maxlength="1" class=" form-control otp-box" required>
          <input type="text" maxlength="1" class=" form-control otp-box" required>
        </div>

        <div class="otp-actions">
          <button type="button" class="btn btn-outline-secondary btn-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="12" viewBox="0 0 15 12" fill="none">
              <path d="M14.1663 5.83331H0.833008M0.833008 5.83331L5.83301 10.8333M0.833008 5.83331L5.83301 0.833313"
                stroke="#A4A7AE" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round" />
            </svg>     <span> Back</span>
          </button>
          <button type="submit" id="confirmBtn" class="btn btn-confirm" disabled>
            Confirm
          </button>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../scripts/auth/verify.js"></script>
</body>

</html>
