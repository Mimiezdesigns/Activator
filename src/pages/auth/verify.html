<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Verification Code - Activator</title>
  <link rel="stylesheet" href="../../styles/css/main.css">
</head>

<body>

  <div class="form-container">
    <div class="form-card text-center ">
      <div class="brand-logo mb-3">
        <img src="../../public//assets/logo/logo_white.svg" class="logo" alt="Activator Logo">
      </div>

      <div class="form-card-inner">

        <h2 class="instruction">Enter Verification Code</h2>
        <p class="">
          We've sent a 6-digit code to your registered device.
          Enter it below to complete sign-in.

        </p>


        <div class="secure">
          <label class="form-label">Secure code</label>
        </div>

        <form id="otpForm" class="form">
          <div class="otp-inputs">
            <input type="text" maxlength="1" class="form-control mega-input-field-base" placeholder="0" required>
            <input type="text" maxlength="1" class=" form-control mega-input-field-base" placeholder="0" required>
            <input type="text" maxlength="1" class=" form-control mega-input-field-base" placeholder="0" required>
            <input type="text" maxlength="1" class=" form-control mega-input-field-base" placeholder="0" required>
            <input type="text" maxlength="1" class=" form-control mega-input-field-base" placeholder="0" required>
            <input type="text" maxlength="1" class=" form-control mega-input-field-base" placeholder="0" required>
          </div>

          <div class="action">
            <button type="button" class="btn btn-secondary btn-md" id="btn-back">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="12" viewBox="0 0 15 12" fill="none">
                <path d="M14.1663 5.83331H0.833008M0.833008 5.83331L5.83301 10.8333M0.833008 5.83331L5.83301 0.833313"
                  stroke="#A4A7AE" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round" />
              </svg> <span> Back</span>
            </button>
            <button type="submit" id="oldUserConfirm" class="btn btn-primary btn-md">
              Confirm
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script src="../../scripts/auth/verify.js"></script>
</body>

</html>
