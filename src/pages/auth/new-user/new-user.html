<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Verification Code - Activator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/css/main.css">
</head>

<body class="verify-body">

  <div class="verify-container">
    <div class="verify-card text-center">
      <div class="brand-logo mb-5">
        <img src="../../../public/assets/logo/logo.png" alt="Activator Logo">
      </div>

      <h4 class="fw-bold mb-2">Set up 2FA Authentication</h4>
      <p class="text-muted">
        To proceed, please scan this QR code with your Google Authenticator App and enter the verification code below.
      </p>

      
      <div class="test-box text-start">
        <p class="fw-semibold mb-1">Test OTP Code: <span class="fw-light">123-456</span></p>
      </div>

      <div>
        <img src="../../../public/assets/images/qrcodescanner.png" alt="" srcset="">
      </div>

      <div class="text-start">
        <label class="form-label fw-semibold">Verification code</label>
      </div>

      <form id="otpForm" action="../change-password.html" >
        <div class="otp-inputs">
          <input type="text" maxlength="1" class="otp-box form-control" required>
          <input type="text" maxlength="1" class="otp-box form-control" required>
          <input type="text" maxlength="1" class="otp-box form-control" required>
          <span class="dash">-</span>
          <input type="text" maxlength="1" class="otp-box form-control" required>
          <input type="text" maxlength="1" class="otp-box form-control" required>
          <input type="text" maxlength="1" class="otp-box form-control" required>
        </div>
        <div class="text-muted text-start">
          <p>Did&apos;t get the code ? clck resend <p>
        </div>
        <div class="d-flex justify-content-between gap-4">
          <button type="button" class="btn btn-outline-secondary back-btn">
            <i class="bi bi-arrow-left"></i> Back
          </button>
          <button type="submit" id="confirmBtn" class="btn confirm-btn" disabled>
            Confirm
          </button>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../scripts/auth/verify.js"></script>
</body>

</html>
