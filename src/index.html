<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./styles/css/main.css">
</head>

<body>

  <div class="login-container">
    <div class="login-card text-center">
      <div class="brand-logo mb-3">
        <img src="./public/assets/logo/logo.png" alt="Activator Logo">
      </div>

      <h4 class="fw-bold mb-2">Log in to your account</h4>
      <p class="text-muted mb-4">Welcome back! Please enter your details.</p>

      <div class="test-box text-start">
        <p class="fw-semibold mb-1">Test Credentials</p>
        <p><strong>Existing User:</strong> admin@activator.com / Admin123!</p>
        <p><strong>New User:</strong> newuser@activator.com / TempPass123!</p>
        <p class="text-muted fs-7"><strong>OTP Code:</strong> 123-456</p>
      </div>

      <form>
        <div class="mb-3 text-start">
          <label for="email" class="form-label">Username</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email">
        </div>

        <div class="mb-3 text-start position-relative">
          <label for="password" class="form-label">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control" id="password" placeholder="••••••••">
            <span class="toggle-password position-absolute end-0 top-50 translate-middle-y me-3 text-muted">
              <i class="bi bi-eye"></i>
            </span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/auth/verify.js"></script>
</body>
</html>
