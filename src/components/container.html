<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Component</title>
    <link rel="stylesheet" href="../styles/css/main.css">
</head>
<body>
    <div class="container" style="background-color: #f8f9fa; padding: 1rem; border: 1px solid #e9ecef;">
        <h1>Default Container</h1>
        <p>This is a default container. It will have a max-width based on the screen size.</p>
    </div>

    <br>

    <div class="container-fluid" style="background-color: #e9ecef; padding: 1rem; border: 1px solid #dee2e6;">
        <h1>Fluid Container</h1>
        <p>This is a fluid container. It will always take 100% width.</p>
    </div>
</body>
</html>
