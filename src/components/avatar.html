<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Component</title>
    <link rel="stylesheet" href="../styles/css/main.css">
</head>
<body>
    <div class="container" style="padding: 2rem; display: flex; align-items: center; gap: 1rem;">
        <div class="avatar avatar-xs">
            <span class="avatar-initials">AV</span>
        </div>
        <div class="avatar avatar-sm">
            <span class="avatar-initials">AV</span>
        </div>
        <div class="avatar avatar-md">
            <span class="avatar-initials">AV</span>
        </div>
        <div class="avatar avatar-lg">
            <span class="avatar-initials">AV</span>
        </div>
        <div class="avatar avatar-xl">
            <span class="avatar-initials">AV</span>
        </div>
        <div class="avatar avatar-2xl">
            <span class="avatar-initials">AV</span>
        </div>
    </div>

    <div class="container" style="padding: 2rem; display: flex; align-items: center; gap: 1rem;">
        <div class="avatar avatar-xs">
            <img src="https://i.pravatar.cc/48?u=1" alt="Avatar" class="avatar-img">
        </div>
        <div class="avatar avatar-sm">
            <img src="https://i.pravatar.cc/48?u=2" alt="Avatar" class="avatar-img">
        </div>
        <div class="avatar avatar-md">
            <img src="https://i.pravatar.cc/48?u=3" alt="Avatar" class="avatar-img">
        </div>
        <div class="avatar avatar-lg">
            <img src="https://i.pravatar.cc/48?u=4" alt="Avatar" class="avatar-img">
        </div>
        <div class="avatar avatar-xl">
            <img src="https://i.pravatar.cc/48?u=5" alt="Avatar" class="avatar-img">
        </div>
        <div class="avatar avatar-2xl">
            <img src="https://i.pravatar.cc/48?u=6" alt="Avatar" class="avatar-img">
        </div>
    </div>
</body>
</html>
