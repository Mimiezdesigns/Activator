<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Component</title>
    <link rel="stylesheet" href="../styles/css/main.css">
</head>
<body>
    <div class="container" style="padding: 2rem;">
        <h1>Badge Component</h1>

        <h2>Small Badge</h2>
        <span class="badge badge-sm">Badge</span>
        <span class="badge badge-sm badge-success">Success</span>
        <span class="badge badge-sm badge-warning">Warning</span>
        <span class="badge badge-sm badge-error">Error</span>

        <h2>Medium Badge</h2>
        <span class="badge badge-md">Badge</span>
        <span class="badge badge-md badge-success">Success</span>
        <span class="badge badge-md badge-warning">Warning</span>
        <span class="badge badge-md badge-error">Error</span>

        <h2>Large Badge</h2>
        <span class="badge badge-lg">Badge</span>
        <span class="badge badge-lg badge-success">Success</span>
        <span class="badge badge-lg badge-warning">Warning</span>
        <span class="badge badge-lg badge-error">Error</span>
    </div>
</body>
</html>
