<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Component</title>
    <link rel="stylesheet" href="../styles/css/main.css">
</head>
<body>
    <div class="container" style="padding: 2rem;">
        <h1>Modal Example</h1>

        <!-- Button to trigger modal -->
        <button type="button" class="btn btn-primary" id="openModalBtn">
            Launch demo modal
        </button>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        ...
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const openModalBtn = document.getElementById('openModalBtn');
            const exampleModal = document.getElementById('exampleModal');
            const closeButtons = exampleModal.querySelectorAll('[data-bs-dismiss="modal"]');

            openModalBtn.addEventListener('click', () => {
                exampleModal.classList.add('show');
                exampleModal.style.display = 'block';
                exampleModal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            });

            closeButtons.forEach(button => {
                button.addEventListener('click', () => {
                    exampleModal.classList.remove('show');
                    exampleModal.style.display = 'none';
                    exampleModal.setAttribute('aria-hidden', 'true');
                    document.body.classList.remove('modal-open');
                });
            });

            // Close modal when clicking outside of it
            exampleModal.addEventListener('click', (event) => {
                if (event.target === exampleModal) {
                    exampleModal.classList.remove('show');
                    exampleModal.style.display = 'none';
                    exampleModal.setAttribute('aria-hidden', 'true');
                    document.body.classList.remove('modal-open');
                }
            });
        });
    </script>
</body>
</html>
