<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Component</title>
    <link rel="stylesheet" href="../styles/css/main.css">
</head>
<body>
    <div class="container" style="padding: 2rem;">
        <h1>Select Component</h1>

        <h2>Default Select</h2>
        <div class="form-select-wrapper">
            <select class="form-select">
                <option>Open this select menu</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>

        <h2>Small Select</h2>
        <div class="form-select-wrapper select-sm">
            <select class="form-select">
                <option>Open this select menu</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>

        <h2>Large Select</h2>
        <div class="form-select-wrapper select-lg">
            <select class="form-select">
                <option>Open this select menu</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>

        <h2>Custom Select Menu</h2>
        <div class="select-menu">
            <div class="select-option">
                <div class="text-and-supporting-text">
                    <div class="text">Option 1</div>
                    <div class="supporting-text">Supporting text</div>
                </div>
            </div>
            <div class="select-option">
                <div class="text-and-supporting-text">
                    <div class="text">Option 2</div>
                </div>
            </div>
            <div class="select-option">
                <div class="text-and-supporting-text">
                    <div class="text">Option 3</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
