<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh; /* full height */
      display: flex;
      justify-content: center; /* center horizontally */
      align-items: center; /* center vertically */
      background-color: #f8f9fa; /* subtle background */
    }

    .center-box {
      border: 2px solid #dcdcdc; /* light grey border */
      border-radius: 8px;
      padding: 40px 60px;
      background-color: #fff; /* white background inside */
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #333;
    }

    p {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="center-box">
    <h1>Welcome to Activator</h1>
    <p>This is the Activator's router management app UI prototype.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
